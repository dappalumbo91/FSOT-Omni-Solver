name: FSOT Omni-Solver CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lock-and-crosscheck:
    name: LOCK hashes + C++20 re-derivation + Python cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y python3-mpmath
      - name: Fetch FSOT-2.1-Cpp at the authority commit (3466e8d, engine pin AEB2AD)
        run: |
          git clone -q https://github.com/dappalumbo91/FSOT-2.1-Cpp.git third_party/FSOT-2.1-Cpp
          git -C third_party/FSOT-2.1-Cpp checkout -q 3466e8d4211d786fa7a430de1ee75131fb3b2e97
      - name: Build C++20 tools
        run: |
          F="-std=c++20 -O2 -ffp-contract=off"
          g++ $F -Ithird_party/FSOT-2.1-Cpp/include -o cpp/derive cpp/derive.cpp
          g++ $F -o cpp/netgen cpp/netgen.cpp
          g++ $F -o cpp/score cpp/score.cpp
      - name: Verify LOCK (sha256 + every hash recorded in LOCK.md + byte-identical re-derivation)
        run: tools/verify_lock.sh
      - name: Python (mpmath, 50 digits) cross-check of the locked C++ targets
        run: |
          python3 tools/crosscheck_mpmath.py | tee /tmp/xc.txt
          python3 -c "import re,sys; d=[abs(float(l.split()[-1])) for l in open('/tmp/xc.txt') if re.match(r'^[A-Za-z_/()0-9]+\t',l) and not l.startswith('quantity')]; print('max rel diff',max(d)); sys.exit(max(d)>1e-14)"
      - name: Falstad links = lz-string of committed circuits, regenerated from locked values
        run: |
          python3 tools/check_falstad_urls.py
          python3 falstad/gen_falstad_core.py
          git diff --exit-code -- falstad/*.txt falstad/*.url

  ngspice:
    name: ngspice nominal slice (TL082 vendor model, fetched + sha256-checked) vs committed results
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y ngspice python3-mpmath unzip
      - name: Reproduce (one script; MC excluded, see ./reproduce.sh --mc)
        run: ./reproduce.sh

  phase2:
    name: Phase 2 — LOCK2 + C++20 re-derivation + nominal ngspice (folds, consts 0/27/50 C, Omega_b h^2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Fetch FSOT-2.1-Cpp at the authority commit (3466e8d)
        run: |
          git clone -q https://github.com/dappalumbo91/FSOT-2.1-Cpp.git third_party/FSOT-2.1-Cpp
          git -C third_party/FSOT-2.1-Cpp checkout -q 3466e8d4211d786fa7a430de1ee75131fb3b2e97
      - name: Reproduce Phase 2 nominal
        run: phase2/tools/reproduce2.sh "$PWD/third_party/FSOT-2.1-Cpp"
      - name: Phase 3 leaf tier 1 (LOCK3 + leaf1 block solve at 27/0 C vs golden)
        run: phase3/tools/reproduce3.sh "$PWD/third_party/FSOT-2.1-Cpp"
      - name: Verify LOCK4 (compiled leaves, byte-identical re-derivation)
        run: cd phase3/tools && ./verify_lock4.sh "$GITHUB_WORKSPACE/third_party/FSOT-2.1-Cpp"
      - name: Verify LOCK5 (byte-identical re-derivation)
        run: cd phase3/tools && ./verify_lock5.sh "$GITHUB_WORKSPACE/third_party/FSOT-2.1-Cpp"
      - name: Verify LOCK6 (byte-identical re-derivation)
        run: cd phase3/tools && ./verify_lock6.sh "$GITHUB_WORKSPACE/third_party/FSOT-2.1-Cpp"
      - name: Verify LOCK7 (byte-identical re-derivation)
        run: cd phase3/tools && ./verify_lock7.sh "$GITHUB_WORKSPACE/third_party/FSOT-2.1-Cpp"
      - name: Verify LOCK7 Amendment 7.1 (byte-identical re-derivation)
        run: cd phase3/tools && ./verify_lock7b.sh "$GITHUB_WORKSPACE/third_party/FSOT-2.1-Cpp"

  phase3-sim:
    name: Phase 3c/3d — LOCK5/LOCK6 compiled leaves, folds with carried tiny taps, tap bench (ideal, 27 C) + score/summary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Reproduce LOCK5/LOCK6 nominal (score5.sh per netlist, tiny6.py; summary in the job summary)
        run: phase3/tools/reproduce5.sh
      - name: Regression check (2x locked baseline, floor 1e-6; rule and approval in phase3/locked_ci/LOCK.md)
        if: always()
        run: |
          cd phase3/locked_ci && sha256sum -c --quiet SHA256SUMS
          while read -r h f; do grep -q "$h" LOCK.md || { echo "hash of $f not recorded in LOCK.md"; exit 1; }; done < SHA256SUMS
          cd ../tools && python3 regress_ci.py check
